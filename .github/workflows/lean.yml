name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build pinned Lean project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: true
          test: false
          lint: false

      - name: Print theorem axioms
        run: lake env lean Audit.lean

      - name: Reject proof placeholders
        run: |
          if rg -n '\b(sorry|admit)\b|^\s*axiom\b' I3322 I3322.lean Audit.lean; then
            echo "Proof placeholder or project axiom found."
            exit 1
          fi
